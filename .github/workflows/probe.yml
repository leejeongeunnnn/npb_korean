name: probe (임시 조사)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests matplotlib
      - run: python tools/probe.py > /tmp/probe.txt 2>&1 || true
      - env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p /tmp/pub && cp /tmp/probe.txt /tmp/pub/ && cd /tmp/pub
          git init -q -b probe && git add . && git -c user.name=bot -c user.email=bot@x commit -q -m probe
          git push -q -f "$PUSH_URL" probe:probe
