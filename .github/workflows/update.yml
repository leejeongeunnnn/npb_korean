name: NPB 데이터 자동 수집

on:
  schedule:
    # 매시간 17분·47분 (UTC 기준). GitHub 예약은 가끔 실행을 건너뛰므로 두 번 걸어 둔다.
    # 정각은 GitHub 대기열이 몰려 지연이 커서 피함
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:   # Actions 탭에서 수동 실행 버튼 제공

permissions:
  contents: write

concurrency:
  group: npb-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 실행
        run: python collect.py

      - name: 오늘·내일 경기 예고 선발·라인업·문자중계
        run: python collect_today.py || echo "[WARN] 오늘 경기 상세 수집 실패 - 다음 실행에서 재시도"

      - name: 새로 끝난 경기 상세 수집
        run: python collect_games.py --minutes 6 --max 40

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f data/live.json   # 실시간 파일은 live 브랜치 전용
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 데이터 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: NPB 데이터 자동 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            echo "푸시 충돌, 재시도 $i"; sleep 5
          done
          exit 1
