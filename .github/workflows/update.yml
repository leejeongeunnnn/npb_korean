name: NPB 데이터 자동 수집

on:
  schedule:
    # UTC 기준. 한국/일본시간(KST/JST = UTC+9)으로 환산:
    #  22:00 UTC = 07:00,  03:00 UTC = 12:00,  08:00 UTC = 17:00,  13:00 UTC = 22:00
    - cron: "0 22,3,8,13 * * *"
  workflow_dispatch:   # Actions 탭에서 수동 실행 버튼 제공

permissions:
  contents: write

concurrency:
  group: npb-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 실행
        run: python collect.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 데이터 없음 - 커밋 생략"
          else
            git commit -m "chore: NPB 데이터 자동 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
