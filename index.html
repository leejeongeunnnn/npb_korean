<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>일본 프로야구(NPB) 대시보드</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 지도(Leaflet) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
        integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A==" crossorigin="" referrerpolicy="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
          integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hqWz3eq7ykx0b8CbyDUfZuVVsjeHs8emIjZIDMjJRgS/GjXZcUjTNQoDwG68ug==" crossorigin="" referrerpolicy="no-referrer"></script>

  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div id="loader">
    <div class="icon-bounce">⚾</div>
    <div class="spinner"></div>
    <div class="loader-title">일본 프로야구 대시보드</div>
    <div class="loader-desc">데이터를 불러오는 중...</div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⚾</span>
      <div>
        <h1>일본 프로야구 대시보드</h1>
        <p class="brand-sub">NPB 2026 · 센트럴 &amp; 퍼시픽 리그</p>
      </div>
    </div>
    <div class="updated" id="updated-at">갱신: —</div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="schedule">🔥 경기 일정</button>
    <button class="tab" data-tab="standings">🏆 순위</button>
    <button class="tab" data-tab="postseason">🍁 포스트시즌</button>
    <button class="tab" data-tab="players">🏃 선수 성적</button>
    <button class="tab" data-tab="stadiums">🏟️ 구장 안내</button>
    <button class="tab" data-tab="teams">📣 팀 소개</button>
    <button class="tab" data-tab="news">📰 오늘 기사</button>
  </nav>

  <main class="container">
    <section id="panel-schedule" class="panel active"></section>
    <section id="panel-standings" class="panel"></section>
    <section id="panel-postseason" class="panel"></section>
    <section id="panel-players" class="panel"></section>
    <section id="panel-stadiums" class="panel"></section>
    <section id="panel-teams" class="panel"></section>
    <section id="panel-news" class="panel"></section>
  </main>

  <footer class="footer">
    데이터 출처: Yahoo! Japan 스포츠 · NPB.jp · Google 뉴스 &nbsp;|&nbsp;
    GitHub Actions로 자동 수집되는 정적 대시보드
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
